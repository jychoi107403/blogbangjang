name: Deploy to Cloudflare

# 1. 실행 조건: main 브랜치에 코드가 push되거나, GitHub 웹에서 수동으로 'Run workflow' 버튼을 눌렀을 때
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 2. 실행 권한 설정
permissions:
  contents: read

# 3. 배포 작업(Job) 정의
jobs:
  deploy:
    name: Build & Deploy to Cloudflare
    runs-on: ubuntu-latest # Windows가 아닌 리눅스 환경에서 OpenNext를 완벽하게 빌드합니다.

    steps:
      # 단계 1: GitHub 저장소 코드 불러오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 단계 2: pnpm 패키지 매니저 설치
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      # 단계 3: Node.js 20 환경 설정 (캐시 활성화로 빌드 속도 향상)
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      # 단계 4: 프로젝트 패키지 설치
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 단계 5: Next.js 16 빌드 및 Cloudflare 자동 배포 실행
      - name: Build and Deploy to Cloudflare
        run: pnpm run deploy
        env:
          # Cloudflare 인증 정보 (GitHub Secrets에서 안전하게 가져옴)
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

          # Supabase 데이터베이스 연결 정보
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # Resend 이메일 뉴스레터 설정
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}

          # 블로그 사이트 메타데이터
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: ${{ secrets.NEXT_PUBLIC_SITE_NAME }}
